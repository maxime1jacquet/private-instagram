<section class="photo-gallery" aria-label="Photos de l’étape">
  @for (image of images(); track image.id) {
    <button
      type="button"
      class="photo-gallery__photo"
      matRipple
      (click)="open($index)"
      [attr.aria-label]="'Agrandir la photo ' + ($index + 1) + ' de ' + title()"
    >
      <img
        class="photo-gallery__image"
        [src]="image.url"
        [alt]="title() + ' — photo ' + ($index + 1)"
        loading="lazy"
      />
    </button>
  } @empty {
    <p>Aucune photo pour cette étape pour le moment.</p>
  }
</section>
