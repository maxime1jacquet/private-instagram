<section class="photo-dialog" aria-labelledby="photo-title">
  <header class="photo-dialog__header">
    <h2 class="photo-dialog__title" id="photo-title">{{ data.title }}</h2>
    <button mat-icon-button mat-dialog-close aria-label="Fermer la photo">×</button>
  </header>
  <div class="photo-dialog__frame">
    <img
      class="photo-dialog__image"
      [src]="data.images[index()].url"
      [alt]="data.title + ' — photo ' + (index() + 1)"
    />
  </div>
  <div class="photo-dialog__controls">
    <button
      mat-stroked-button
      (click)="previous()"
      [disabled]="index() === 0"
      aria-label="Photo précédente"
    >
      ←</button
    ><span aria-live="polite">{{ index() + 1 }} / {{ data.images.length }}</span
    ><button
      mat-stroked-button
      (click)="next()"
      [disabled]="index() === data.images.length - 1"
      aria-label="Photo suivante"
    >
      →
    </button>
  </div>
  <a mat-button [href]="data.images[index()].url" target="_blank" rel="noopener"
    >Ouvrir l’original</a
  >
</section>
